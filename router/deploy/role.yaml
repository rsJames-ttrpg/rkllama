# Role to access pods, configmaps, and secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rkllama-router
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "watch"]
